name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI only needs read access; do not grant write-capable repository tokens.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: gainora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gainora_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: gainora_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply schema to disposable PostgreSQL and test roles
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap-ci.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/audit_workflow_integrity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/fixed_synthetic_demo.sql
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
